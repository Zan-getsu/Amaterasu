name: CI

"on":
  push:
  pull_request:

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"
  AMATERASU_SERVICE_PWD_SALT: "00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff"
  AMATERASU_PIN_SALT: "ffeeddccbbaa99887766554433221100ffeeddccbbaa99887766554433221100"
  AMATERASU_DB_PARTITION_SALT: "wzmlx_v3_db_partition_salt"

jobs:
  filetolink:
    name: FileToLink cache, library and ZIP checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install focused test dependencies
        run: python -m pip install pytest pytest-asyncio fastapi==0.141.1 httpx aiofiles wzgram==3.1.5
      - name: Test media storage and range streaming
        run: python -m pytest tests/test_filetolink_library.py tests/test_adaptive_tg_stream.py

  merge-media:
    name: Linux Merge Regression Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install merge test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg mkvtoolnix
          python -m pip install pytest pytest-asyncio "$(grep '^fonttools==' requirements.txt)"
      - name: Exercise real media and merged-only delivery
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          from types import ModuleType
          import pytest

          # Load the real helpers without starting unrelated bot services.
          for name in ("bot", "bot.helper", "bot.helper.ext_utils"):
              package = ModuleType(name)
              package.__path__ = [str(Path(*name.split(".")).resolve())]
              sys.modules[name] = package
          raise SystemExit(pytest.main(["-q", "tests/test_merge_media.py", "tests/test_merge_upload_scope.py"]))
          PY

  smoke:
    name: Smoke Checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install test runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-asyncio

      - name: Compile Python sources
        run: |
          paths="bot web config_sample.py cron_boot.py update.py git_runtime.py scripts/git_as_repo_owner.py"
          if [ -d tests ]; then
            paths="$paths tests"
          fi
          python -m compileall $paths

      - name: Run lightweight smoke tests
        run: |
          test_files=""
          for file in tests/test_config.py tests/test_security.py tests/test_multimedia_stack.py; do
            if [ -f "$file" ]; then
              test_files="$test_files $file"
            fi
          done
          if [ -z "$test_files" ]; then
            echo "No lightweight smoke test files found in this branch; skipping pytest."
            exit 0
          fi
          python -m pytest -v $test_files

      - name: Report ruff findings
        continue-on-error: true
        run: |
          python -m pip install ruff
          ruff check . --output-format=github
          ruff format --check .

      - name: Report dependency audit
        continue-on-error: true
        run: |
          python -m pip install pip-audit
          pip-audit -r requirements.txt
