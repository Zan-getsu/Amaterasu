<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Amaterasu{% endblock %}</title>
  {% include "brand_icons.html" %}
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/main.css" />
  {% block extra_css %}{% endblock %}
</head>
<body>
  {% block navbar %}
  <nav class="bs-navbar">
    <div class="bs-navbar__inner">
      <a href="/" class="bs-navbar__brand" aria-label="Amaterasu home">
        <img class="bs-navbar__logo" src="/static/images/brand/blackflare.svg" width="32" height="32" alt="" />
        <span class="bs-navbar__title"><img class="bs-navbar__wordmark" src="/static/images/brand/wordmark-white.svg" width="128" height="20" alt="Amaterasu" /></span>
      </a>
      <div class="bs-navbar__links">
        <!-- Links removed to keep pages visually isolated -->
      </div>
      <div class="bs-navbar__actions">
        <!-- Status indicator -->
        <div class="bs-status-badge bs-status-badge--online">
          <span class="bs-status-badge__dot"></span>
          <span>Online</span>
        </div>
      </div>
    </div>
  </nav>
  {% endblock %}

  <main class="bs-main">
    {% block content %}{% endblock %}
  </main>

  <div id="bs-toast-container" class="bs-toast-container"></div>
  <script src="/static/js/ui.js" defer></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      lucide.createIcons();
    });
  </script>
  {% block extra_js %}{% endblock %}
</body>
</html>
